# ─────────────────────────────────────────────────────────────────────────────
# Framehouse — Docker Compose
#
# Starts three services for local development:
#   mongo   — MongoDB 7 replica set (required by Prisma transactions)
#   server  — Express API on port 5000
#   client  — Vite dev server on port 5173
#
# Usage:
#   docker compose up              — start all three services
#   docker compose up mongo        — start only the database
#   docker compose up mongo server — start database + API (no frontend)
#   docker compose down -v         — stop and remove containers + volumes
#
# First run:
#   1. Copy server/.env.example → server/.env and fill in your values
#   2. docker compose up mongo     (wait for "Waiting for connections" log)
#   3. docker compose run --rm server npm run db:seed
#   4. docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── MongoDB 7 — replica set mode (Prisma requires transactions) ────────────
  mongo:
    image: mongo:7.0
    container_name: framehouse_mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # Init script runs once to configure the replica set
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try {
            rs.status().ok
          } catch(e) {
            rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok
          }
        " || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - framehouse

  # ─── Express API ─────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: development
    container_name: framehouse_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount source for hot-reload via node --watch
      - ./server/src:/app/src:ro
      - ./server/prisma:/app/prisma:ro
      # Persist local mock photo storage across restarts
      - server_storage:/app/storage
      # node_modules stays inside the container (not overwritten by mount)
      - /app/node_modules
    env_file:
      - ./server/.env
    environment:
      # Override database URL to point at the compose mongo service
      DATABASE_URL: "mongodb://mongo:27017/framehouse_dev?replicaSet=rs0&directConnection=true"
      NODE_ENV: development
      PORT: 5000
      SERVER_URL: "http://localhost:5000"
      CLIENT_URL: "http://localhost:5173"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - framehouse
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── Vite Dev Server ─────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: framehouse_client
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./client/src:/app/src:ro
      - ./client/index.html:/app/index.html:ro
      - ./client/vite.config.js:/app/vite.config.js:ro
      - ./client/public:/app/public:ro
      - /app/node_modules
    environment:
      VITE_SERVER_URL: "http://localhost:5000"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - framehouse

# ─── Named volumes ────────────────────────────────────────────────────────────
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  server_storage:
    driver: local

# ─── Network ─────────────────────────────────────────────────────────────────
networks:
  framehouse:
    driver: bridge
