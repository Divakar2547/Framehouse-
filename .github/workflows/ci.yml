name: CI — Test & Build

# Runs on every pull request and every push to main.
# On pull requests: lint + unit test + build (no deploy).
# On push to main:  same checks, then deploy triggers fire.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Backend: lint · typecheck · unit tests
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  server-tests:
    name: 🖥  Server — Lint · Tests
    runs-on: ubuntu-latest

    # Spin up MongoDB as a replica set (required by Prisma transactions)
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Initialise the MongoDB replica set that the mongo service started above
      - name: Initialise MongoDB replica set
        run: |
          sleep 5
          docker exec $(docker ps -q --filter ancestor=mongo:7.0) \
            mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" || true
          sleep 3

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/framehouse_test?replicaSet=rs0&directConnection=true' }}

      - name: Seed test database
        run: node prisma/seed.js
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/framehouse_test?replicaSet=rs0&directConnection=true' }}
          JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-32-chars
          GALLERY_SESSION_SECRET: ci-test-gallery-session-secret-key-32chars
          SERVER_URL: http://localhost:5000
          CLIENT_URL: http://localhost:5173

      - name: Run Jest tests
        run: npm test -- --coverage --forceExit
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mongodb://localhost:27017/framehouse_test?replicaSet=rs0&directConnection=true' }}
          JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-32-chars
          GALLERY_SESSION_SECRET: ci-test-gallery-session-secret-key-32chars
          SERVER_URL: http://localhost:5000
          CLIENT_URL: http://localhost:5173
          AWS_REGION: us-east-1
          # Leave AWS keys empty — server uses local disk mock storage fallback
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_S3_BUCKET: ''

      - name: Upload server coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Frontend: lint · unit tests · build
# ─────────────────────────────────────────────────────────────────────────────
  client-tests:
    name: 🌐 Client — Lint · Tests · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm test
        env:
          VITE_SERVER_URL: https://framehouse-r7yy.onrender.com

      - name: Upload client coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: client/coverage/
          retention-days: 7

      - name: Build production bundle
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL || 'https://framehouse-r7yy.onrender.com' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 3

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — E2E tests (only on push to main, not PRs — requires running servers)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    # Only run E2E on pushes to main, not on every PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Initialise MongoDB replica set
        run: |
          sleep 5
          docker exec $(docker ps -q --filter ancestor=mongo:7.0) \
            mongosh --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})" || true
          sleep 3

      - name: Generate Prisma client and seed DB
        run: |
          npx prisma generate
          node prisma/seed.js
        working-directory: server
        env:
          DATABASE_URL: mongodb://localhost:27017/framehouse_e2e?replicaSet=rs0&directConnection=true
          JWT_SECRET: e2e-jwt-secret-key-must-be-at-least-32-chars-long
          GALLERY_SESSION_SECRET: e2e-gallery-session-secret-32-chars-long
          SERVER_URL: http://localhost:5000
          CLIENT_URL: http://localhost:5173

      - name: Start backend server
        run: node src/server.js &
        working-directory: server
        env:
          NODE_ENV: test
          PORT: 5000
          DATABASE_URL: mongodb://localhost:27017/framehouse_e2e?replicaSet=rs0&directConnection=true
          JWT_SECRET: e2e-jwt-secret-key-must-be-at-least-32-chars-long
          GALLERY_SESSION_SECRET: e2e-gallery-session-secret-32-chars-long
          SERVER_URL: http://localhost:5000
          CLIENT_URL: http://localhost:5173
          AWS_ACCESS_KEY_ID: ''
          AWS_SECRET_ACCESS_KEY: ''
          AWS_S3_BUCKET: ''

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:5000/health && echo "Backend ready" && break
            echo "Waiting for backend... ($i/20)"
            sleep 2
          done

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        working-directory: client
        env:
          E2E_BASE_URL: http://localhost:5173
          VITE_SERVER_URL: http://localhost:5000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7
